<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article class="calculator">
      <div class="display">
        <span class="display__small" id="smDisplay">0x</span>
        <span class="display__large" id="lgDisplay">0</span>
      </div>

      <section class="pad" id="pad">
        <div class="row">
          <button class="key clear-entry">CE</button>
          <button class="key clear">C</button>
          <button class="key operator">&divide;</button>
          <button class="key backspace">&#x232B;</button>
        </div>
        <div class="row">
          <button class="key number">7</button>
          <button class="key number">8</button>
          <button class="key number">9</button>
          <button class="key operator">&times;</button>
        </div>
        <div class="row">
          <button class="key number">4</button>
          <button class="key number">5</button>
          <button class="key number">6</button>
          <button class="key operator">&minus;</button>
        </div>
        <div class="row">
          <button class="key number">1</button>
          <button class="key number">2</button>
          <button class="key number">3</button>
          <button class="key operator">&plus;</button>
        </div>
        <div class="row">
          <button class="key negate">&plusmn;</button>
          <button class="key number">0</button>
          <button class="key">,</button>
          <button class="key equals">&equals;</button>
        </div>
      </section>
    </article>

    <script src="js/main.js"></script>
  </body>
</html>
